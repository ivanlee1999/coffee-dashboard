services:
  backend:
    build: ./backend
    ports:
      - "8095:8095"
    volumes:
      - ./data:/app/data
    environment:
      - DB_DIR=/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx reverse proxy so the static frontend can reach the API
  # at /api without CORS issues in production
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
